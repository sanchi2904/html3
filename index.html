<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🎀 Barbie Dream Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>💗 Welcome to Barbie's Dream Gallery 💗</h1>

  <!-- Slideshow -->
  <div class="slideshow">
    <img id="slide" src="arnika.png" alt="Barbie Slide">
  </div>

  <!-- Thumbnail Gallery -->
  <div class="gallery">
    <img src="arnika.png" class="thumb" alt="Thumb 1">
    <img src="mariposa.png" class="thumb" alt="Thumb 2">
    <img src="diamondcastle.png" class="thumb" alt="Thumb 3">
  </div>

  <!-- Enlarge on click -->
  <div id="popup">
    <span id="close">&times;</span>
    <img id="popup-img" src="">
  </div>

  <script src="script.js"></script>
</body>
</html>
